# ============================================================
# provider-service 外部配置（★优先级高于 jar 内打包的 application.yml）
#
# 用途：改这里的日期 / 收件人 / 开关后，重启服务即可生效，
#       不需要重新 mvn package（jar 内的配置是打包时的快照，改源码 yml 不影响它）。
#
# 只需要写「要覆盖的项」，没写的项自动用 jar 内默认值。
# ============================================================
report:
  daily:
    # ---------- 主邮件 ----------
    main:
      mail-to: "591111450@qq.com"    # ★当前按你源码 yml 里的改法指向你自己（测试用？发领导前记得改回 1137851593@qq.com）
      use-fixed-date: true           # true = 用下面 6 个日期，不再按「前一天/前两天/去年同日」推算
      start-date: "2026-09-01"       # 本期开始
      end-date: "2026-09-30"         # 本期结束
      cmp-start-date: "2026-08-01"   # 环比开始
      cmp-end-date: "2026-08-30"     # 环比结束
      yoy-start-date: "2025-09-01"   # 同比开始
      yoy-end-date: "2025-09-30"     # 同比结束

      # 企业微信群机器人：填了就把本组截图推到对应群（先发一条摘要，再逐张发图）
      # 获取：企业微信群 → 设置 → 群机器人 → 添加 → 复制 Webhook 地址
      # 与 mail-to 互不冲突：两个都填 = 邮件和企微都发；想停邮件就把上面 mail-to 清空
      wecom-webhook: ""              # ← 拿到地址后粘到这里，重启生效

      # 企微摘要文案（图片上面那段文字）。留空 = 用代码默认模板；
      # 填了就完全按你写的发。支持占位符：{date} {cur} {cmp} {yoy} {range}
      # 单行写法（换行写 \n）：
      #   wecom-digest: "**佳和销售日报 {date}**\n> 本期：{cur}\n> 同比：{yoy}"
      # 多行写法（推荐，去掉注释井号即可，注意缩进对齐）：
      #   wecom-digest: |
      #     **佳和销售日报 {date}**
      #     > 本期：{cur}
      #     > 环比：{cmp}
      #     > 同比：{yoy}
      wecom-digest: ""

    # ---------- 副邮件（需要固定日期时照上面格式加 use-fixed-date + 6 个日期即可）----------
    secondary:
      use-fixed-date: false
      wecom-webhook: ""              # ← 副组想推另一个群就填这里
      wecom-digest: ""               # ← 副组文案（同上，留空用默认模板）
