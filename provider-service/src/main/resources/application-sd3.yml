# ============================================================
# 销售详情3（SD3）独立配置  ——  2026-10-15 新建
#
# ★ 本文件与销售详情1/2 的 application.yml 完全隔离，
#   原 application.yml 保持只服务 SD1/SD2，不做任何改动。
# ★ 加载方式：Sd3Config 上用 @PropertySource + YamlPropertySourceFactory 读本文件。
# ★ 改完重启生效（IDEA 里跑读的就是这个文件）。
# ============================================================
sd3:

  # ---------- MySQL 数据源（bcm 库，与 SD1/SD2 的 SQL Server 相互独立）----------
  datasource:
    # 注意：JDBC 的 characterEncoding 只认 utf8 / UTF-8，写 utf8mb4 会抛
    # 「Unsupported character encoding 'utf8mb4'」导致数据源启动失败
    jdbc-url: "jdbc:mysql://192.168.0.62:3416/bcm?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull"
    username: "root"
    password: "Enjoyit.1JMysql"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------- 取数 SQL ----------
  # 默认读 classpath 下的文件；也可填绝对路径指向 jar 外的 .sql（改 SQL 不用重新打包）
  sql-file: "classpath:sd3/sales-detail3.sql"

  # ---------- 页面默认参数 ----------
  # 机构 = 门店编码「精确匹配」，多个用逗号分隔：default-org-code: "1103011,1103021"
  default-org-code: ""        # 页面打开时机构框默认值（空=不筛选机构）
  default-chnl: ""            # 页面打开时渠道默认值（空=全部渠道）

  # 渠道下拉选项（单选，顺序 = 表格里渠道分组的展示顺序）
  chnl-options:
    - "昂捷到家01"
    - "美团闪购"
    - "淘宝闪购"
    - "03京东到家"

  # ---------- 渠道销售金额补差（2026-10-16 新增）----------
  # 页面/截图的「销售额」= 分组（门店+渠道）求和销售额 + 补差：
  #   淘宝闪购      → 补差 = 该组「包装费」列求和（数据来自 SQL 输出，无需配置；固定逻辑）
  #   下面列出的渠道 → 补差 = 该组订单数 × 每单补差（单位：元/单）
  # ★★ key 必须写成 "[渠道名]"（英文方括号 + 引号），这是 Spring Boot 的 Map 绑定规则：
  #    非「小写字母/数字/连字符」的 key 不加方括号会被吞掉——实测「美团闪购」变空、
  #    「03京东到家」变「03」，补差会静默失效！以后新增渠道照抄这个写法。
  # ★ 渠道名必须与 chnl_name 完全一致；未列出的渠道不补差；改完重启生效
  chnl-per-order-fee:
    "[美团闪购]": 1
    "[昂捷到家01]": 1
    "[03京东到家]": 1
  cron: "0 28 08 * * ?"
  chnl: ""                    # 渠道：留空=全部渠道；填了只发该渠道（所有截图共用）
  order-no: ""                # 订单号：一般留空（所有截图共用）
  screenshots:
    - org-code: "1103011,1103021,1104019,1106001,1104018,1104017"
      tag: "001"
      title: "菏泽区域线上销售"        # 本张图顶部标题（每张图可不同；留空用全局 title）
      total-label: "菏泽区域线上销售共计"        # 本张图底部总计行文案（每张图可不同；留空用全局 total-label）
    - org-code: "1101031,1101001,1102010,1102023,1102032,1102023,1102006,1102034,1102001"
      tag: "002"
      title: "巨野区域线上销售"
      total-label: "巨野区域线上销售共计"

  # 日期：false = 每天自动取「前一天」；true = 固定用下面两个日期
  use-fixed-date: false
  start-date: "2026-10-01"
  end-date: "2026-10-13"

  # ---------- 推送渠道（与 SD1/SD2 逻辑一致，两个都填就都发）----------
  mail-to: "591111450@qq.com"                 # 邮件收件人，留空不发邮件
  wecom-webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=0fe8f6c9-8ce2-4a57-bc5e-759c711fd729"           # 企业微信机器人 Webhook，留空不推企微
  # 企微摘要文案，留空用默认模板；支持占位符 {date} {org} {chnl} {amt} {orders} {avg}
  wecom-digest: "线上销售报表"

  # ---------- 截图输出目录 ----------
  # ★ 用绝对路径（与 SD1 的 report.daily.output-dir 一致）。不要用相对路径 target/report：
  #   IDEA 里跑时工作目录不是 provider-service，相对路径会 NoSuchFileException。
  #   Linux 部署时改成服务器上的绝对路径。
  output-dir: "C:/work/MyTeamWork/provider-service/target/report"

  # ---------- 截图标题 / 底部总计行文案 ----------
  # 顶部标题（截图 <h2> 那行）：留空用默认「销售详情3（外卖渠道）」；每条截图可用 title 单独覆盖
  title: "线上销售报表"

  # 底部总计行文案（总计行左侧会合并成一个大格，跨 序号/门店编码/门店名称/平台 4 列）
  # 每条截图可用 total-label 单独覆盖；留空用这里
  total-label: "线上外卖销售共计"
