server:
  port: 8001

spring:
  application:
    name: provider-service
  mail:
    host: smtp.qq.com
    port: 465
    username: 591111450@qq.com
    password: ${MAIL_AUTH_CODE:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
          socketFactory.port: 465
  datasource:
    url: jdbc:sqlserver://192.168.0.66:1543;databaseName=RDS_BC;encrypt=false;trustServerCertificate=true
    username: mis_user
    password: Enjoyit.2SqlServer
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  # RDS_SC 数据源（盘点报表专用）
  datasource-sc:
    url: jdbc:sqlserver://192.168.0.66:1543;databaseName=RDS_SC;encrypt=false;trustServerCertificate=true
    username: mis_user
    password: Enjoyit.2SqlServer
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ===== 销售详情日报（每天早晨 10:00 定时任务）=====
report:
  daily:
    cron: "0 0 10 * * ?"          # 每天早上 10:00 触发
    org-code: "1101001"           # SalesDetail 机构编码
    org-code2: "1101,1102,1191001" # SalesDetail2 机构编码（巨野组/便利组）
    mail-to: "591111450@qq.com"   # 收件人
    mail-from: "591111450@qq.com" # 发件人（需与 spring.mail.username 一致）
    chrome-path: ""               # 留空则自动探测 Chrome/Edge 路径
    output-dir: "C:/work/MyTeamWork/provider-service/target/report"  # HTML/截图输出目录
