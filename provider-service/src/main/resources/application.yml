# ============================================================
# 销售详情日报 定时任务配置（每天发送，时间见 report.daily.cron）
#
# 邮件分两组：main（主邮件）/ secondary（副邮件），每组结构完全一样：
#   mail-to     收件人邮箱
#   screenshots 截图列表（想发几张就配几条，顺序即发送顺序）
#
# 每张截图 3 个字段：
#   type      报表类型：sd1=销售详情1，sd2=销售详情2
#   org-code  机构编码（多个用英文逗号分隔，如 "1101,1102,1191001"）
#   tag       文件名后缀：同一报表有多张不同机构的截图时必填（否则同名互相覆盖！）
#             留空则文件名不带后缀；例：tag=1101031 → sales-detail-{日期}-1101031.png
#
# ★ 以后加截图：在 main 或 secondary 的 screenshots 下复制一行改三个字段即可，无需改代码
# ============================================================
report:
  daily:
    cron: "0 25 08 * * ?"          # 定时发送时间（cron 表达式，每天上午 8:29）
    mail-from: "591111450@qq.com"  # 发件人（需与 spring.mail.username 一致）
    mail-to: "591111450@qq.com"    # 默认收件人兜底（仅手动触发接口用；定时任务收件人看下方 main/secondary）
    chrome-path: ""                # 留空则自动探测 Chrome/Edge 路径
    output-dir: "C:/work/MyTeamWork/provider-service/target/report"  # HTML/截图输出目录
    # ---------- 机构过滤（查询+截图共用） ----------
    # 逗号分隔的机构编码，这些机构在 SD2 查询结果和截图中都会被过滤掉（不参与展示、不参与合计）。
    # 留空或注释掉 = 不过滤。示例：exclude-org-codes: "1101901,1101911,1191201"
    exclude-org-codes: "1101901,1101911,1191201"

    # ---------- 日期来源开关（★2026-10-01 新增，main / secondary 各自独立配置）----------
    # 每个邮件分组都可以单独指定「查询用哪几天」，两种模式二选一：
    #
    #   ① use-fixed-date: false（默认）—— 推算模式
    #      本期=前一天、环比=前两天、同比=去年同日。下面 6 个日期全部忽略。
    #
    #   ② use-fixed-date: true —— 固定日期模式
    #      本组所有截图统一用下面 6 个日期查询，不再推算。
    #      某个日期留空 → 该字段回退到推算值，并在日志打 WARN（不会静默用错口径）。
    #
    # ★ 用显式开关判断，而不是「日期有没有填」，避免漏填一个日期就悄悄改变整组口径。
    #
    # 命令行临时覆盖示例（不改 yml 也能一次性换个日期重发）：
    #   java -jar provider.jar --server.port=8011 \
    #     --report.daily.main.use-fixed-date=true \
    #     --report.daily.main.start-date=2026-09-30 --report.daily.main.end-date=2026-09-30 \
    #     --report.daily.main.cmp-start-date=2026-09-29 --report.daily.main.cmp-end-date=2026-09-29 \
    #     --report.daily.main.yoy-start-date=2025-09-30 --report.daily.main.yoy-end-date=2025-09-30

    # ---------- 主邮件（目前 3 张截图） ----------
    main:
      mail-to: "1137851593@qq.com"   # 主收件人
      use-fixed-date: false          # false=按「前一天/前两天/去年同日」推算（默认）；改成 true 则启用下方固定日期
      start-date: "2026-09-01"                 # 本期开始，如 "2026-09-30"
      end-date: "2026-09-30"                   # 本期结束，如 "2026-09-30"
      cmp-start-date: "2026-08-01"             # 环比开始，如 "2026-09-29"
      cmp-end-date: "2026-08-30"               # 环比结束，如 "2026-09-29"
      yoy-start-date: "2025-09-01"             # 同比开始，如 "2025-09-30"
      yoy-end-date: "2025-09-30"               # 同比结束，如 "2025-09-30"
      screenshots:
        - type: sd1                # 销售详情1（主图）
          org-code: "1101001"
          tag: ""                  # 无后缀：sales-detail-{日期}.png
        - type: sd1                # 销售详情1（第三张，仅机构不同）
          org-code: "1101031"
          tag: "1101031"           # sales-detail-{日期}-1101031.png
        - type: sd2                # 销售详情2
          org-code: "1101,1102,1191001,1191201"
          tag: ""                  # 无后缀：sales-detail2-{日期}.png

    # ---------- 副邮件（目前 2 张截图） ----------
    secondary:
      mail-to: "wangzizhi_2020@qq.com"  # 副收件人
      use-fixed-date: false          # 与主邮件互不影响，可单独开关
      start-date: "2026-09-01"
      end-date: "2026-09-30"
      cmp-start-date: "2026-08-01"
      cmp-end-date: "2026-08-30"
      yoy-start-date: "2025-09-01"
      yoy-end-date: "2025-09-30"
      screenshots:
        - type: sd1                # 销售详情1（机构 1103011）
          org-code: "1103011"
          tag: "1103011"           # sales-detail-{日期}-1103011.png
        - type: sd1                # 销售详情1（机构 1103011）
          org-code: "1103021"
          tag: "1103021"           # sales-detail-{日期}-1103011.png
        - type: sd2                # 销售详情2（机构 1103,1104）—— 与主邮件 SD2 同参数，仅机构不同
          org-code: "1103,1104,1106"
          tag: "1103-1104"         # sales-detail2-{日期}-1103-1104.png
          union-stock-codes: "1104901,1103801"   # 追加「仅库存」门店（UNION ALL 语义）：即使无销售也显示库存行；留空不追加
  # ===== 销售报表1 预计算（每天凌晨 2:00 定时跑批，结果存 dw.rpt_sale_detail_precompute）=====
  precompute:
    cron: "0 0 2 * * ?"           # 每天凌晨 2:00 触发
    org-code: "1101001,1101031"           # 报表1 机构编码，支持多个用英文逗号分隔（如 "1101001,1102"），定时任务逐个跑批
    report-type: "SALE_DETAIL_1"  # 报表1 类型标识
    sale2:
      org-code: "1101,1102,1191001" # 报表2 机构编码（多机构整体串，逗号分隔）；定时任务一次引擎调用全返回，行自带机构编码。可改 1101,1102 等子集。
