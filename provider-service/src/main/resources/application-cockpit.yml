# ============================================================
# 集团驾驶舱数据源（192.168.0.120 / RDS_SC）—— 2026-11-23 新建
#
# ★ 只读数据源：账号 readonly_jdc 仅授予查询权限，连接池也显式 setReadOnly(true)。
#   驾驶舱只做 SELECT，禁止任何 INSERT/UPDATE/DELETE/DDL。
# ★ 与其它数据源完全隔离：
#     application.yml       → primary(RDS_BC@.66) + sc(RDS_SC@.66)
#     application-sd3.yml   → MySQL bcm
#     application-sd4.yml   → RDS_SC@.66
#     application-rds27.yml → RDS_BC/RDS_SC@.27
#   本文件只服务 CockpitDataSourceConfig 里的 cockpitDataSource / cockpitJdbcTemplate。
# ★ 由 CockpitDataSourceConfig 通过 @PropertySource + YamlPropertySourceFactory 加载；
#   改完需重新打包（classpath 配置），无法通过外部 config 覆盖。
# ★ @Lazy + initializationFailTimeout=-1：.120 宕机不影响 provider 启动，
#   只有真正调用驾驶舱接口时才会因取连接失败而报错（前端会自动退回示例数据）。
# ============================================================
cockpit:
  # 租户固定 8（集团）
  tenant-id: 8
  # 门店下钻的品类层级（tb_md_gdsclass.c_level），业务确认取 3
  brand-level: 3

  datasource:
    url: "jdbc:sqlserver://192.168.0.120:1543;databaseName=RDS_SC;encrypt=false;trustServerCertificate=true"
    username: "readonly_jdc"
    password: "jidachuanA@123"
    driver-class-name: "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    # 连接只读（SQL Server 下是提示性标志，真正的权限收紧靠只读账号本身）
    read-only: true
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
