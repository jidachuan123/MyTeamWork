# ============================================================
# 销售详情4（SD4，配送调拨汇总表）独立配置  ——  2026-10-16 新建
#
# ★ 本文件与 SD1/SD2（application.yml）、SD3（application-sd3.yml）完全隔离，
#   原 application.yml 保持只服务 SD1/SD2，不做任何改动。
# ★ 加载方式：Sd4DataSourceConfig 上用 @PropertySource + YamlPropertySourceFactory 读本文件。
# ★ 改完重启生效（IDEA 里跑读的就是这个文件）。
# ============================================================
sd4:

  # ---------- 数据源（SQL Server）----------
  # ★ 实测：tb_io_om / tb_io_om_g 等表在 RDS_SC 库（RDS_BC 无此表，用户原 SQL 注释亦标注 use rds_sc）
  datasource:
    url: "jdbc:sqlserver://192.168.0.66:1543;databaseName=RDS_SC;encrypt=false;trustServerCertificate=true"
    username: "mis_user"
    password: "Enjoyit.2SqlServer"
    driver-class-name: "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  # ---------- 取数 SQL ----------
  # 默认读 classpath 下的模板；也可填绝对路径指向 jar 外的 .sql（改 SQL 不用重新打包）
  sql-file: "classpath:sd4/delivery-transfer-summary.sql"

  # ============================================================
  # SQL 参数配置（原 SQL 里 DECLARE 的参数，全部在这里配置）
  # ★ 只有「6 个日期 + 发货机构」会在页面出现供手工查询，其余参数仅在这里配。
  # ============================================================

