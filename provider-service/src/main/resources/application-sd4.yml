  acc-type: ""                  # @记账类型（空=全部；可填 内部配送 / 内部批发）

  # ---------- 页面默认参数（6 个日期 + 发货机构 = 页面上可输入的 7 个参数）----------
  # 6 个日期默认值 = 销售详情1 的推算逻辑：记账=前一天、环比=前两天、同比=去年同日
  # 页面打开时按此推算展示；定时任务按下面的定时参数（含 use-fixed-date 开关）
  default-out-org-codes: "1101901,1101911,1191201"   # 页面发货机构框默认值（空=全部）

  # ---------- 定时任务 ----------
  # 每天发送时间（避开 SD1/SD2 的 8:29 与 SD3 的 8:35，防止同时抢 Chrome）
  cron: "0 30 08 * * ?"

  # 定时发送时的查询参数（页面手动查询不受此限制，页面用啥就是啥）
  out-org-codes: "1101901,1191201"           # 发货机构：逗号分隔；空=全部

  # 日期：false = 每天自动推算（记账=前一天、环比=前两天、同比=去年同日）；
  #       true = 固定用下面 6 个日期（留空的项回退推算值并打 WARN）
  use-fixed-date: false
  acc-start-date: "2026-10-01"
  acc-end-date: "2026-10-15"
  cmp-start-date: "2026-10-13"
  cmp-end-date: "2026-10-13"
  yoy-start-date: "2025-10-01"
  yoy-end-date: "2025-10-01"

  # ---------- 推送渠道（与 SD1/SD2/SD3 逻辑一致，两个都填就都发）----------
  mail-to: "591111450@qq.com"                 # 邮件收件人，留空不发邮件
  wecom-webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=0fe8f6c9-8ce2-4a57-bc5e-759c711fd729"           # 企业微信机器人 Webhook，留空不推企微
  # 企微摘要文案，留空用默认模板；支持占位符 {date} {accRange} {cmpRange} {yoyRange} {org}
  wecom-digest: "配送调拨汇总报表"

  # ---------- 截图输出目录 ----------
  # ★ 用绝对路径（与 SD1/SD3 一致）。不要用相对路径：IDEA 里跑时工作目录不是 provider-service，
  #   相对路径会 NoSuchFileException。Linux 部署时改成服务器上的绝对路径。
  output-dir: "C:/work/MyTeamWork/provider-service/target/report"

  # ---------- 截图标题 ----------
  # 截图顶部标题（默认「配送调拨汇总表」）
  title: "配送调拨汇总表"
