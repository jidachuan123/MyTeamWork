  depart-codes: "1,11,1101,1103,1111,1115,1122,1181,12,1201,1211,1212,1221,1281,13,1301,1311,1321,1325,1331,1335,1381,15,1501,1521,1581,18,1881,19,1901,1902,1903,1904,2,21,2101,2102,2103,2104,2105,2106,3,31,3101,3102,3103,3104,3161,3162,3163,3164,32,3201,3202,3203,3204,3205,3206,3207,3211,3251,3261,3262,3263,3264,3265,3266,33,3301,3302,3303,3304,3305,3306,3307,3361,3362,3363,3364,3365,3366,3367,3391,34,3401,3402,3403,3404,3405,3406,3407,3408,3409,36,3601,3602,3603,3604,3605,4,41,4101,4111,42,4201,4211,4251,43,4301,44,4401,4405,45,4501,4551,6,60,6001,6031,61,6101,6102,6111,6112,6113,6114,63,6301,6311,6312,6313,6314,64,6401,66,6601,68,6801,6811,6821,8,81,8101,8131,8181,8191,9,91,9151,92,9201,93,9301,97,9701,99,9901"
